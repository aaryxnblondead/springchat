<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Login</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 min-h-screen flex items-center justify-center">
    <div class="container max-w-sm">
        <div class="bg-gray-800 p-8 rounded-lg shadow-md">
            <h2 class="text-2xl font-bold text-center text-white mb-6">Login</h2>
            <div th:if="${param.error}" class="alert alert-danger" role="alert">
                Invalid username or password
            </div>
            <div th:if="${param.logout}" class="alert alert-success" role="alert">
                You have been logged out
            </div>
            <form th:action="@{/login}" method="post">
                <div class="mb-4">
                    <label for="username" class="block text-gray-300 text-sm font-medium mb-2">Username:</label>
                    <input type="text" id="username" name="username" required 
                           class="form-control bg-gray-700 text-white border-gray-600 focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                </div>
                <div class="mb-4">
                    <label for="password" class="block text-gray-300 text-sm font-medium mb-2">Password:</label>
                    <input type="password" id="password" name="password" required 
                           class="form-control bg-gray-700 text-white border-gray-600 focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                </div>
                <div class="mt-6">
                    <button type="submit" class="btn btn-primary w-full bg-blue-600 hover:bg-blue-700 transition-colors">
                        Login
                    </button>
                </div>
            </form>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
