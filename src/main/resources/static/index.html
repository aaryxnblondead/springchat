<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
    <title>Spring Chat App</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900">
    <div id="username-page" class="min-h-screen flex items-center justify-center">
        <div class="bg-gray-800 p-8 rounded-lg shadow-md w-96">
            <h1 class="text-2xl font-bold text-center mb-6 text-white">Enter your username</h1>
            <form id="usernameForm" name="usernameForm">
                <div class="mb-4">
                    <input type="text" id="name" placeholder="Username" autocomplete="off" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 bg-gray-700 text-white border-gray-600" />
                </div>
                <div>
                    <button type="submit" class="w-full bg-blue-600 text-white py-2 px-4 rounded-lg hover:bg-blue-700 transition-colors">Start Chatting</button>
                </div>
            </form>
        </div>
    </div>

    <div id="chat-page" class="hidden min-h-screen bg-gray-900">
        <div class="max-w-4xl mx-auto bg-gray-800 shadow-md rounded-lg">
            <div class="bg-blue-600 p-4 rounded-t-lg flex justify-between items-center">
                <h2 class="text-white text-xl font-semibold">Spring Chat App</h2>
                <button id="logoutbutton" class="bg-red-600 text-white px-4 py-2 rounded-lg hover:bg-red-700 transition-colors">Logout</button>
            </div>
            <div class="connecting p-4 text-gray-300">
                Connecting...
            </div>
            <ul id="messageArea" class="p-4 space-y-4 h-[500px] overflow-y-auto text-gray-200">
            </ul>
            <form id="messageForm" name="messageForm" class="border-t border-gray-700 p-4">
                <div class="flex space-x-2">
                    <input type="text" id="message" placeholder="Type a message..." autocomplete="off" class="flex-1 px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 bg-gray-700 text-white border-gray-600"/>
                    <button type="submit" class="bg-blue-600 text-white px-6 py-2 rounded-lg hover:bg-blue-700 transition-colors">Send</button>
                </div>
            </form>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.1.4/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
    <script src="/js/main.js"></script>
</body>
</html>
