server.address=localhost
spring.application.name=springchat

# Server port
server.port=8081

# Logging
logging.level.org.springframework=INFO
logging.level.chatapp.springchat=DEBUG

# Spring MVC
spring.mvc.view.prefix=/
spring.mvc.view.suffix=.html

# Disable Spring Security auto-configuration
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration

# PostgreSQL Connection Properties
spring.datasource.url=jdbc:postgresql://localhost:5432/chatapp
spring.datasource.username=main
spring.datasource.password=main
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Properties
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
